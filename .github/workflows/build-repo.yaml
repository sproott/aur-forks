name: Build and publish to custom repo
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      build_all:
        description: "Build every package, ignoring the diff"
        type: boolean
        default: true

permissions:
  contents: write

env:
  REPO_NAME: myaur
  RELEASE_TAG: repo

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Restore Pacman package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            pacman-${{ runner.arch }}-

      - name: Install tooling
        run: pacman -Sy --noconfirm git github-cli pacman-contrib

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # diff the squash-merge commit against its parent

      - name: Configure existing custom repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /repo-cache
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              -p '*.pkg.tar.zst' -p "$REPO_NAME.db.tar.zst" -D /repo-cache
            cp --remove-destination "/repo-cache/$REPO_NAME.db.tar.zst" "/repo-cache/$REPO_NAME.db"
            cat >> /etc/pacman.conf <<EOF

          [$REPO_NAME]
          SigLevel = Optional TrustAll
          Server = file:///repo-cache
          EOF
            pacman -Sy --noconfirm
          fi

      - name: Determine package dirs to build
        id: changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          all_dirs() {
            find . -name PKGBUILD -not -path './.git/*' \
              -exec dirname {} \; | sed 's|^\./||' | sort -u
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && [ "${{ inputs.build_all }}" = "true" ]; then
            echo "Manual build_all requested"
            dirs=$(all_dirs)
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Nightly VCS package build"
            dirs=$(all_dirs | grep -- '-git$' || true)
          elif ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "No parent commit (initial commit) — building everything"
            dirs=$(all_dirs)
          else
            dirs=$(git diff --name-only HEAD^ HEAD \
                  | grep -E '(^|/)PKGBUILD$' | xargs -r -n1 dirname | sort -u)
          fi
          { echo "dirs<<EOF"; echo "$dirs"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Stage existing package assets
        run: |
          mkdir -p /out
          cp /repo-cache/*.pkg.tar.zst /out/ 2>/dev/null || true

      - name: Build changed packages
        if: steps.changed.outputs.dirs != ''
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder  # makepkg -s needs it
          chown builder /out
          chown -R builder .
          mapfile -t package_dirs <<< "${{ steps.changed.outputs.dirs }}"
          sudo -H -u builder ./scripts/build-packages.sh --output /out "${package_dirs[@]}"

      - name: Reconcile repo db and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          allowed_package_bases=$(
            find . -name PKGBUILD -not -path './.git/*' -exec dirname {} \; \
              | sort -u \
              | while read -r dir; do
                  (cd "$dir" && makepkg --printsrcinfo)
                done \
              | awk '$1 == "pkgbase" { print $3 }' \
              | sort -u
          )

          cd /out
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
                 -t "Package repository" -n "Rolling custom pacman repository"

          declare -A newest_file newest_version
          for archive in ./*.pkg.tar.zst; do
            [ -e "$archive" ] || continue
            read -r package version _ < <(pacman -Qp "$archive")
            package_base=$(bsdtar -xOf "$archive" .PKGINFO \
              | awk '$1 == "pkgbase" { print $3 }')
            if ! grep -Fxq "$package_base" <<< "$allowed_package_bases"; then
              rm "$archive"
            elif [ -z "${newest_version[$package]:-}" ] \
              || [ "$(vercmp "$version" "${newest_version[$package]}")" -gt 0 ]; then
              [ -z "${newest_file[$package]:-}" ] || rm "${newest_file[$package]}"
              newest_file[$package]="$archive"
              newest_version[$package]="$version"
            else
              rm "$archive"
            fi
          done

          current_archives=$(find /repo-cache -maxdepth 1 -name '*.pkg.tar.zst' \
            -printf '%f\n' | sort)
          desired_archives=$(find . -maxdepth 1 -name '*.pkg.tar.zst' \
            -printf '%f\n' | sort)
          release_assets=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')

          changed=false
          if [ "$current_archives" != "$desired_archives" ]; then
            changed=true
          else
            while read -r archive; do
              [ -n "$archive" ] || continue
              cmp --silent "/repo-cache/$archive" "$archive" || changed=true
            done <<< "$desired_archives"
          fi

          for metadata in \
            "$REPO_NAME.db.tar.zst" "$REPO_NAME.db" \
            "$REPO_NAME.files.tar.zst" "$REPO_NAME.files"; do
            grep -Fxq "$metadata" <<< "$release_assets" || changed=true
          done

          if [ "$changed" = false ]; then
            echo "Package set and contents unchanged; release already current"
            exit 0
          fi

          rm -f "$REPO_NAME.db" "$REPO_NAME.db.tar.zst" \
            "$REPO_NAME.files" "$REPO_NAME.files.tar.zst"
          repo-add "$REPO_NAME.db.tar.zst" ./*.pkg.tar.zst
          cp --remove-destination "$(readlink -f "$REPO_NAME.db.tar.zst")" "$REPO_NAME.db"
          cp --remove-destination "$(readlink -f "$REPO_NAME.files.tar.zst")" "$REPO_NAME.files"

          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' \
            | while read -r asset; do
                gh release delete-asset "$RELEASE_TAG" "$asset" \
                  -R "$GITHUB_REPOSITORY" --yes
              done
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber \
             ./*.pkg.tar.zst "$REPO_NAME.db.tar.zst" "$REPO_NAME.db" \
             "$REPO_NAME.files.tar.zst" "$REPO_NAME.files"

      - name: Prune Pacman package cache
        if: always()
        run: |
          find /var/cache/pacman/pkg -type f -name '*.part' -delete
          paccache --remove --keep 1
          paccache --remove --uninstalled --keep 0
