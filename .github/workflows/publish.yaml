name: Publish custom package repository

on:
  workflow_run:
    workflows: [Validate forked AUR packages]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: forks-publish
  cancel-in-progress: false

env:
  REPO_NAME: myaur
  RELEASE_TAG: repo

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tooling
        run: pacman -Sy --noconfirm git github-cli

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download validated packages
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p /out /repo-cache
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n repository-packages -D /out
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              -p '*.pkg.tar.zst' -D /repo-cache
          fi

      - name: Reconcile repo db and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          allowed_package_bases=$(
            find . -name .SRCINFO -not -path './.git/*' -exec cat {} + \
              | awk '$1 == "pkgbase" { print $3 }' \
              | sort -u
          )

          cd /out
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
                 -t "Package repository" -n "Rolling custom pacman repository"

          declare -A newest_file newest_version
          for archive in ./*.pkg.tar.zst; do
            [ -e "$archive" ] || continue
            read -r package version _ < <(pacman -Qp "$archive")
            package_base=$(bsdtar -xOf "$archive" .PKGINFO \
              | awk '$1 == "pkgbase" { print $3 }')
            if ! grep -Fxq "$package_base" <<< "$allowed_package_bases"; then
              rm "$archive"
            elif [ -z "${newest_version[$package]:-}" ] \
              || [ "$(vercmp "$version" "${newest_version[$package]}")" -gt 0 ]; then
              [ -z "${newest_file[$package]:-}" ] || rm "${newest_file[$package]}"
              newest_file[$package]="$archive"
              newest_version[$package]="$version"
            else
              rm "$archive"
            fi
          done

          current_archives=$(find /repo-cache -maxdepth 1 -name '*.pkg.tar.zst' \
            -printf '%f\n' | sort)
          desired_archives=$(find . -maxdepth 1 -name '*.pkg.tar.zst' \
            -printf '%f\n' | sort)
          release_assets=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')

          changed=false
          if [ "$current_archives" != "$desired_archives" ]; then
            changed=true
          else
            while read -r archive; do
              [ -n "$archive" ] || continue
              cmp --silent "/repo-cache/$archive" "$archive" || changed=true
            done <<< "$desired_archives"
          fi

          for metadata in \
            "$REPO_NAME.db.tar.zst" "$REPO_NAME.db" \
            "$REPO_NAME.files.tar.zst" "$REPO_NAME.files"; do
            grep -Fxq "$metadata" <<< "$release_assets" || changed=true
          done

          if [ "$changed" = false ]; then
            echo "Package set and contents unchanged; release already current"
            exit 0
          fi

          rm -f "$REPO_NAME.db" "$REPO_NAME.db.tar.zst" \
            "$REPO_NAME.files" "$REPO_NAME.files.tar.zst"
          repo-add "$REPO_NAME.db.tar.zst" ./*.pkg.tar.zst
          cp --remove-destination "$(readlink -f "$REPO_NAME.db.tar.zst")" "$REPO_NAME.db"
          cp --remove-destination "$(readlink -f "$REPO_NAME.files.tar.zst")" "$REPO_NAME.files"

          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' \
            | while read -r asset; do
                gh release delete-asset "$RELEASE_TAG" "$asset" \
                  -R "$GITHUB_REPOSITORY" --yes
              done
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber \
             ./*.pkg.tar.zst "$REPO_NAME.db.tar.zst" "$REPO_NAME.db" \
             "$REPO_NAME.files.tar.zst" "$REPO_NAME.files"