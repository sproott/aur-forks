name: Validate forked AUR packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      build_all:
        description: "Build every package, ignoring the diff"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: forks-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      binary_changes: ${{ steps.binaries.outputs.binary_changes }}
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm git github-cli pacman-contrib sudo

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Pacman packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ runner.arch }}-${{ hashFiles('**/PKGBUILD') }}
          restore-keys: |
            pacman-${{ runner.arch }}-

      - name: Cache makepkg sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/makepkg/src
          key: makepkg-src-${{ runner.arch }}-${{ hashFiles('**/PKGBUILD', '**/.SRCINFO') }}
          restore-keys: |
            makepkg-src-${{ runner.arch }}-

      - name: Cache Stack artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/makepkg/stack
          key: stack-${{ runner.arch }}-${{ hashFiles('**/stack.yaml', '**/stack.yaml.lock', '**/package.yaml', '**/*.cabal') }}
          restore-keys: |
            stack-${{ runner.arch }}-

      - name: Configure existing custom repo
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: repo
          REPO_NAME: myaur
        run: |
          mkdir -p /repo-cache
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              -p '*.pkg.tar.zst' -p "$REPO_NAME.db.tar.zst" -D /repo-cache
            cp --remove-destination "/repo-cache/$REPO_NAME.db.tar.zst" "/repo-cache/$REPO_NAME.db"
            cat >> /etc/pacman.conf <<EOF

          [$REPO_NAME]
          SigLevel = Optional TrustAll
          Server = file:///repo-cache
          EOF
            pacman -Sy --noconfirm
          fi

      - name: Determine package dirs to build
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          direct_dirs=""
          infra_changes=""

          all_dirs() {
            find . -name PKGBUILD -not -path './.git/*' \
              -exec dirname {} \; | sed 's|^\./||' | sort -u
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && [ "${{ inputs.build_all }}" = "true" ]; then
            dirs=$(all_dirs)
            reason="Full validation requested"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            dirs=$(all_dirs | grep -- '-git$' || true)
            reason="Scheduled VCS package validation"
            BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || true)
          elif ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            dirs=$(all_dirs)
            reason="No comparison commit available"
          else
            changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            infra_changes=$(
              grep -E '^(\.github/workflows/validate\.yaml|scripts/build-packages\.sh)$' \
                <<< "$changed_files" || true
            )
            direct_dirs=$(
              while read -r path; do
                package_dir=${path%%/*}
                [ -f "$package_dir/PKGBUILD" ] && echo "$package_dir"
              done <<< "$changed_files" | sort -u
            )
            if [ -n "$infra_changes" ]; then
              dirs=$(all_dirs)
              reason="Shared validation infrastructure changed"
            else
              dirs=$direct_dirs
              reason="Package changes detected"
            fi
          fi

          version_changes=""
          if [ -n "$direct_dirs" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            while read -r package_dir; do
              previous_version=$(
                git show "$BASE_SHA:$package_dir/.SRCINFO" 2>/dev/null \
                  | awk '$1 == "pkgver" { pkgver = $3 } $1 == "pkgrel" { pkgrel = $3 } END { if (pkgver) printf "%s-%s", pkgver, pkgrel }'
              )
              current_version=$(
                awk '$1 == "pkgver" { pkgver = $3 } $1 == "pkgrel" { pkgrel = $3 } END { if (pkgver) printf "%s-%s", pkgver, pkgrel }' \
                  "$package_dir/.SRCINFO"
              )
              if [ -n "$previous_version" ] && [ "$previous_version" != "$current_version" ]; then
                printf -v version_change '%s\t%s\t%s' \
                  "$package_dir" "$previous_version" "$current_version"
                version_changes+="$version_change"$'\n'
              fi
            done <<< "$direct_dirs"
            version_changes=${version_changes%$'\n'}
          fi

          if [ -n "$dirs" ]; then
            declare -A package_dirs_by_name selected
            while read -r package_dir; do
              selected["$package_dir"]=1
            done <<< "$dirs"

            while read -r package_dir; do
              while read -r package_name; do
                package_dirs_by_name["$package_name"]=$package_dir
              done < <(awk '$1 == "pkgname" { print $3 }' "$package_dir/.SRCINFO")
            done < <(all_dirs)

            added=true
            while [ "$added" = true ]; do
              added=false
              for package_dir in "${!selected[@]}"; do
                while read -r dependency; do
                  dependency=${dependency%%[<>=]*}
                  dependency_dir=${package_dirs_by_name[$dependency]:-}
                  if [ -n "$dependency_dir" ] && [ -z "${selected[$dependency_dir]:-}" ]; then
                    selected["$dependency_dir"]=1
                    added=true
                  fi
                done < <(
                  awk '$1 == "depends" || $1 == "makedepends" || $1 == "checkdepends" { print $3 }' \
                    "$package_dir/.SRCINFO"
                )
              done
            done

            dirs=$(printf '%s\n' "${!selected[@]}" | sort)
          fi

          {
            echo 'dirs<<EOF'
            echo "$dirs"
            echo 'EOF'
            echo 'direct_dirs<<EOF'
            echo "$direct_dirs"
            echo 'EOF'
            echo 'version_changes<<EOF'
            echo "$version_changes"
            echo 'EOF'
            echo 'infra_changes<<EOF'
            echo "$infra_changes"
            echo 'EOF'
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Stage existing package assets
        run: |
          mkdir -p /out
          cp /repo-cache/*.pkg.tar.zst /out/ 2>/dev/null || true

      - name: Build changed packages
        id: build
        if: steps.changed.outputs.dirs != ''
        run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          install -d -o builder -g builder /built
          install -d -o builder -g builder /var/cache/makepkg/src
          install -d -o builder -g builder /var/cache/makepkg/stack
          install -d /etc/makepkg.conf.d
          printf 'SRCDEST=/var/cache/makepkg/src\n' > /etc/makepkg.conf.d/source-cache.conf
          chown -R builder:builder .
          mapfile -t package_dirs <<< "${{ steps.changed.outputs.dirs }}"
          sudo -H -u builder env STACK_ROOT=/var/cache/makepkg/stack \
            ./scripts/build-packages.sh --output /built "${package_dirs[@]}"

      # A rebuild with the same filename as a published package never replaces it:
      # pacman clients cache by filename, and changed content ships only through a
      # pkgrel bump.
      - name: Compare rebuilt packages with published ones
        id: binaries
        if: steps.build.outcome == 'success'
        run: |
          changed_dirs=""
          for archive in /built/*.pkg.tar.zst; do
            name=${archive##*/}
            if [ ! -f "/out/$name" ]; then
              cp -- "$archive" /out/
            elif [ "$(./scripts/package-manifest.sh "/out/$name")" \
              != "$(./scripts/package-manifest.sh "$archive")" ]; then
              pkgbase=$(bsdtar -xOf "$archive" .PKGINFO | awk '$1 == "pkgbase" { print $3 }')
              for srcinfo in */.SRCINFO; do
                grep -qx "pkgbase = $pkgbase" "$srcinfo" \
                  && changed_dirs+="${srcinfo%/.SRCINFO}"$'\n'
              done
            fi
          done
          {
            echo 'binary_changes<<EOF'
            printf '%s' "$changed_dirs" | sort -u
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload package repository artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: repository-packages
          path: /out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1

      - name: Report validation
        if: always()
        env:
          BINARY_CHANGES: ${{ steps.binaries.outputs.binary_changes }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DIRECT_DIRS: ${{ steps.changed.outputs.direct_dirs }}
          INFRA_CHANGES: ${{ steps.changed.outputs.infra_changes }}
          PACKAGE_DIRS: ${{ steps.changed.outputs.dirs }}
          REASON: ${{ steps.changed.outputs.reason }}
          VERSION_CHANGES: ${{ steps.changed.outputs.version_changes }}
        run: |
          {
            echo '<!-- forks-validation-report -->'
            echo '## Forked AUR package validation'
            echo
            if [ -n "$INFRA_CHANGES" ]; then
              echo '> [!WARNING]'
              echo '> **Shared validation infrastructure changed.** All packages were rebuilt.'
              echo '>'
              while read -r path; do echo "> - \`$path\`"; done <<< "$INFRA_CHANGES"
              echo
            fi
            if [ -n "$BINARY_CHANGES" ]; then
              echo '> [!IMPORTANT]'
              echo '> **Rebuilt binaries differ from published ones of the same version.**'
              echo '>'
              while read -r package_dir; do echo "> - \`$package_dir\`"; done <<< "$BINARY_CHANGES"
              echo '>'
              if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
                echo '> `pkgrel` is bumped automatically on this branch.'
              else
                echo '> Published binaries are kept. Bump `pkgrel` to ship the rebuilt ones.'
              fi
              echo
            fi
            echo "**Result:** ${BUILD_OUTCOME:-not run}"
            echo "**Selection:** ${REASON:-Change detection did not complete}"
            echo
            echo '### Changed packages'
            if [ -n "$DIRECT_DIRS" ]; then
              while read -r package_dir; do echo "- \`$package_dir\`"; done <<< "$DIRECT_DIRS"
            else
              echo '- None'
            fi
            echo
            echo '### Package version changes'
            if [ -n "$VERSION_CHANGES" ]; then
              while IFS=$'\t' read -r package_dir previous_version current_version; do
                echo "- \`$package_dir\`: \`$previous_version\` -> \`$current_version\`"
              done <<< "$VERSION_CHANGES"
            else
              echo '- None'
            fi
            echo
            echo '### Validated packages'
            if [ -n "$PACKAGE_DIRS" ]; then
              while read -r package_dir; do echo "- \`$package_dir\`"; done <<< "$PACKAGE_DIRS"
            else
              echo '- None'
            fi
          } > forks-validation-report.md

          cat forks-validation-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update PR validation comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- forks-validation-report -->'
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"$marker\")) | .id" \
            | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --raw-field "body=$(cat forks-validation-report.md)"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --raw-field "body=$(cat forks-validation-report.md)"
          fi

      - name: Prune Pacman package cache
        if: always()
        run: |
          find /var/cache/pacman/pkg -type f -name '*.part' -delete
          paccache --remove --keep 1
          paccache --remove --uninstalled --keep 0
  bump-pkgrel:
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.build.outputs.binary_changes != ''
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm git

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.FIXUP_TOKEN }} # PAT or App token, so the push re-runs validation

      - name: Bump pkgrel and regenerate .SRCINFO
        env:
          PACKAGE_DIRS: ${{ needs.build.outputs.binary_changes }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd --create-home builder
          chown -R builder .
          while read -r package_dir; do
            [ -n "$package_dir" ] || continue
            pkgrel=$(awk '$1 == "pkgrel" { print $3; exit }' "$package_dir/.SRCINFO")
            sed -i "s/^pkgrel=.*/pkgrel=$(( ${pkgrel%%.*} + 1 ))/" "$package_dir/PKGBUILD"
            sudo -u builder bash -c "cd '$package_dir' && makepkg --printsrcinfo > .SRCINFO"
          done <<< "$PACKAGE_DIRS"

      - name: Commit back
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: bump pkgrel for changed binaries"
          file_pattern: "*/PKGBUILD */.SRCINFO"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
